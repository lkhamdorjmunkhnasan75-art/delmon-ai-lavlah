name: PostgreSQL tests

on:
  push:
    branches:
      - develop/mvp-foundation
  pull_request:

permissions:
  contents: read

jobs:
  directory-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_PASSWORD: local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LAVLAH_POSTGRES_IMAGE: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check migration, access policies, and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_public_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/public_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_public_directory.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_public_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/public_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_public_category_names.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_public_category_names.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_public_category_names.sql
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed hash-locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-ci.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pip check
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements-ci.lock --require-hashes --disable-pip
      - name: Provision disposable restricted API login
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_integration_login LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_public_reader TO lavlah_integration_login"
      - name: HTTP to PostgreSQL integration
        env:
          LAVLAH_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_public_integration.py -v
      - name: Install browser
        run: |
          python -m playwright install --with-deps chromium
      - name: Browser integration on mobile viewport
        env:
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@localhost:5432/postgres
        run: |
          python -m uvicorn lavlah.public_api:app --host 127.0.0.1 --port 8000 > /tmp/lavlah-ui.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/lavlah-ui.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          python -m unittest discover -s tests -p browser_ui.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build Next PWA and audit dependencies
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        working-directory: pwa
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
          npm run build
          git diff --exit-code -- package-lock.json
      - name: Next PWA browser integration
        env:
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@localhost:5432/postgres
          LAVLAH_API_ORIGIN: http://127.0.0.1:8000
        run: |
          python -m uvicorn lavlah.public_api:app --host 127.0.0.1 --port 8000 > /tmp/pwa-api.log 2>&1 &
          api=$!
          (cd pwa && exec npm run start -- --hostname 127.0.0.1) > /tmp/pwa-next.log 2>&1 &
          ui=$!
          trap 'kill "$api" "$ui" 2>/dev/null || true; cat /tmp/pwa-api.log /tmp/pwa-next.log' EXIT
          for port in 8000 3000; do
            for i in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:$port/ >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:$port/ >/dev/null
          done
          timeout 120 python -m unittest discover -s tests -p browser_pwa.py -v
      - name: Mock billing migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_mock_payments.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_mock_payments.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_mock_payments.sql
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_billing_test LOGIN PASSWORD 'ci-billing-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_mock_billing TO lavlah_billing_test"
      - name: Transactional mock billing tests
        env:
          LAVLAH_BILLING_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_BILLING_DSN: postgresql://lavlah_billing_test:ci-billing-only@localhost:5432/postgres
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_mock_billing.py -v
      - name: Ingestion migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_ingestion.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_ingestion.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_ingestion.sql
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_ingest_test LOGIN PASSWORD 'ci-ingest-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_review_test LOGIN PASSWORD 'ci-review-only' NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_ingestion TO lavlah_ingest_test"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_ingestion_reviewer TO lavlah_review_test"
      - name: Scheduled collection migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/006_collection.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/006_collection.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/006_collection.sql
      - name: Authorized ingestion integration
        env:
          LAVLAH_INGESTION_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@localhost:5432/postgres
          LAVLAH_INGESTION_DSN: postgresql://lavlah_ingest_test:ci-ingest-only@localhost:5432/postgres
          LAVLAH_REVIEW_DSN: postgresql://lavlah_review_test:ci-review-only@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_ingestion.py -v
      - name: Scheduled collection integration
        env:
          LAVLAH_COLLECTION_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_INGESTION_DSN: postgresql://lavlah_ingest_test:ci-ingest-only@localhost:5432/postgres
          LAVLAH_REVIEW_DSN: postgresql://lavlah_review_test:ci-review-only@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_collection.py -v
      - name: HTTPS source migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/007_https_sources.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/007_https_sources.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/007_https_sources.sql
      - name: Integrated scheduler migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/008_scheduler.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/008_scheduler.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/008_scheduler.sql
      - name: Reliability migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/009_reliability.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/009_reliability.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/009_reliability.sql
      - name: Authorized HTTPS adapter integration (offline transport)
        env:
          LAVLAH_HTTPS_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_INGESTION_DSN: postgresql://lavlah_ingest_test:ci-ingest-only@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_https_adapter.py -v
      - name: Integrated scheduler tests (offline)
        env:
          LAVLAH_SCHEDULER_INTEGRATION: '1'
          LAVLAH_TEST_ADMIN_DSN: postgresql://postgres:local-test@localhost:5432/postgres
          LAVLAH_INGESTION_DSN: postgresql://lavlah_ingest_test:ci-ingest-only@localhost:5432/postgres
        run: python -B -m unittest discover -s tests -p test_scheduler.py -v
      - name: Synthetic identity migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/010_identity.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/010_identity.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/010_identity.sql
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_identity_login LOGIN PASSWORD 'ci-identity-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_identity TO lavlah_identity_login"
      - name: Shared API limits migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/011_api_limits.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/011_api_limits.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/011_api_limits.sql
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE lavlah_rate_login LOGIN PASSWORD 'ci-rate-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT lavlah_rate TO lavlah_rate_login"
      - name: Ingestion integrity migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/012_ingestion_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/012_ingestion_integrity.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/012_ingestion_integrity.sql
      - name: Billing integrity migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/013_billing_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/013_billing_integrity.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/013_billing_integrity.sql
      - name: Chat quality migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/014_chat_quality.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/014_chat_quality.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/014_chat_quality.sql
      - name: Ingestion authorization migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/015_ingestion_authorization.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/015_ingestion_authorization.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/015_ingestion_authorization.sql
      - name: Database boundary migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/016_db_boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/016_db_boundary.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/016_db_boundary.sql
      - name: Atomic review migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/017_atomic_review.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/017_atomic_review.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/017_atomic_review.sql
      - name: Reviewer identity migration and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/018_reviewer_identity.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/018_reviewer_identity.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/018_reviewer_identity.sql
      - name: Backup and restore disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/recovery_seed.sql
          bash tests/backup_restore.sh
      - name: Isolated synthetic pilot database
        env:
          LAVLAH_PILOT_ONLY: '1'
          LAVLAH_PILOT_INTEGRATION: '1'
          LAVLAH_PILOT_DSN: postgresql://postgres:local-test@127.0.0.1:5432/lavlah_pilot_test
          LAVLAH_PUBLIC_DSN: postgresql://lavlah_integration_login:ci-only-password@127.0.0.1:5432/lavlah_pilot_test
        run: |
          createdb lavlah_pilot_test
          trap 'dropdb --if-exists lavlah_pilot_test' EXIT
          service=$(bash tests/ci_postgres_container.sh)
          [[ "$service" =~ ^[a-f0-9]+$ ]]
          docker exec -e PGPASSWORD="$PGPASSWORD" "$service" pg_dump -h 127.0.0.1 -U postgres --schema-only --schema=lavlah postgres > /tmp/lavlah-pilot-schema.sql
          psql -X -v ON_ERROR_STOP=1 -d lavlah_pilot_test -f /tmp/lavlah-pilot-schema.sql
          psql -X -v ON_ERROR_STOP=1 -c "ALTER DATABASE lavlah_pilot_test SET lavlah.pilot_only='yes'"
          export LAVLAH_PILOT_CONTAINER_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$service")
          python -B -m unittest discover -s tests -p test_pilot_fixtures.py -v
          python -B -m unittest discover -s tests -p test_mongolian_qa.py -v
          python -B -m unittest discover -s tests -p test_grounded_ai.py -v
          python -B -m unittest discover -s tests -p test_pilot_security.py -v
          export LAVLAH_IDENTITY_DSN=postgresql://lavlah_identity_login:ci-identity-only@127.0.0.1:5432/lavlah_pilot_test
          python -B -m unittest discover -s tests -p test_identity_isolation.py -v
          python -B -m unittest discover -s tests -p test_identity_boundary.py -v
          export LAVLAH_RATE_DSN=postgresql://lavlah_rate_login:ci-rate-only@127.0.0.1:5432/lavlah_pilot_test
          python -B -m unittest discover -s tests -p test_api_limits.py -v
          export LAVLAH_INGESTION_DSN=postgresql://lavlah_ingest_test:ci-ingest-only@127.0.0.1:5432/lavlah_pilot_test
          export LAVLAH_REVIEW_DSN=postgresql://lavlah_review_test:ci-review-only@127.0.0.1:5432/lavlah_pilot_test
          python -B -m unittest discover -s tests -p test_ingestion_integrity.py -v
          export LAVLAH_BILLING_DSN=postgresql://lavlah_billing_test:ci-billing-only@127.0.0.1:5432/lavlah_pilot_test
          python -B -m unittest discover -s tests -p test_billing_integrity.py -v
          python -B -m unittest discover -s tests -p test_chat_quality.py -v
          python -m lavlah.pilot_fixtures seed
          export LAVLAH_ENV=pilot LAVLAH_PILOT_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          export LAVLAH_SYNTHETIC_KEY=$(python -c 'print((b"x"*32).hex())') LAVLAH_ENABLE_IDENTITY_CHAT=1
          export LAVLAH_ENABLE_PILOT_QA=1 LAVLAH_ENABLE_MOCK_AI=1 LAVLAH_ENABLE_PILOT_CHAT=1 LAVLAH_API_ORIGIN=http://127.0.0.1:8001 PILOT_CHAT_ORIGIN=http://127.0.0.1:3001
          python -m uvicorn lavlah.public_api:app --host 127.0.0.1 --port 8001 --no-proxy-headers --no-access-log > /tmp/pilot-api.log 2>&1 &
          api=$!
          (cd pwa && exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001) > /tmp/pilot-next.log 2>&1 &
          ui=$!
          trap 'kill "$api" "$ui" 2>/dev/null || true; dropdb --if-exists --force lavlah_pilot_test; rm -f /tmp/lavlah-pilot-schema.sql; cat /tmp/pilot-api.log /tmp/pilot-next.log' EXIT
          for port in 8001 3001; do
            for i in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:$port/ >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:$port/ >/dev/null
          done
          kill -0 "$api" "$ui"
          set -o pipefail
          token=$(python -c 'import os,json; print(json.dumps({"password":os.environ["LAVLAH_PILOT_PASSWORD"]}))' | curl --fail --silent --show-error -H 'Origin: http://127.0.0.1:3001' -H 'Content-Type: application/json' -d @- http://127.0.0.1:3001/api/pilot/login | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $token" -H 'Origin: http://127.0.0.1:3001' -H 'Content-Type: application/json' -d '{"question":"Altan nar zasvar"}' http://127.0.0.1:3001/api/pilot/ask | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="matched" and d["items"][0]["source_url"]=="https://pilot.example.test/0"'
          unset token
          timeout 120 python -B -m unittest discover -s tests -p browser_pilot_chat.py -v
          timeout 120 python -B -m unittest discover -s tests -p browser_identity_chat.py -v

name: PostgreSQL tests

on:
  push:
    branches:
      - develop/mvp-foundation
  pull_request:

permissions:
  contents: read

jobs:
  directory-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-test
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check migration, access policies, and rollback
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/directory.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.down.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_directory.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/directory.sql

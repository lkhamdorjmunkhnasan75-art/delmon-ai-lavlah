name: Supply chain evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate lock candidate or consume reviewed lock
        run: |
          mkdir -p artifacts
          if test -f requirements-ci.lock; then
            cp requirements-ci.lock artifacts/requirements-ci.lock
          else
            python scripts/lock_dependencies.py artifacts/requirements-ci.lock
          fi
      - name: Verify repeatable hash-only install
        run: |
          python -m venv /tmp/lavlah-locked-a
          python -m venv /tmp/lavlah-locked-b
          for env in /tmp/lavlah-locked-a /tmp/lavlah-locked-b; do
            "$env/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r artifacts/requirements-ci.lock
            "$env/bin/python" -m pip check
            "$env/bin/python" -m pip freeze > "$env/freeze.txt"
          done
          diff /tmp/lavlah-locked-a/freeze.txt /tmp/lavlah-locked-b/freeze.txt
          echo "Two hash-verified installations matched"
      - name: Audit locked Python packages and generate CycloneDX SBOM
        run: |
          /tmp/lavlah-locked-a/bin/pip-audit -r artifacts/requirements-ci.lock --require-hashes --disable-pip
          /tmp/lavlah-locked-a/bin/pip-audit -r artifacts/requirements-ci.lock --require-hashes --disable-pip -f cyclonedx-json -o artifacts/python-sbom.json
      - name: npm locked install, audit and SBOM
        working-directory: pwa
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm sbom --sbom-format cyclonedx > ../artifacts/npm-sbom.json
      - name: Test locked Python runtime
        run: /tmp/lavlah-locked-a/bin/python -B -m unittest discover -s tests -v
      - name: Redacted repository and reachable Git history scan
        if: always()
        run: python scripts/scan_secrets.py --apply-reviewed-history
      - name: Upload lock and SBOM evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-evidence
          path: |
            artifacts/requirements-ci.lock
            artifacts/python-sbom.json
            artifacts/npm-sbom.json
          if-no-files-found: error
          retention-days: 7

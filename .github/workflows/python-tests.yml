name: Python tests

on:
  push:
    branches:
      - develop/mvp-foundation
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed hash-locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-ci.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pip check
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements-ci.lock --require-hashes --disable-pip
      - run: python -B -m unittest discover -s tests -v

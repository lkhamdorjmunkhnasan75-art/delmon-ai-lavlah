name: Python tests

on:
  push:
    branches:
      - develop/mvp-foundation
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-public.txt
      - run: python -B -m unittest discover -s tests -v
